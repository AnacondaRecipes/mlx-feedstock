{% set name = "mlx" %}
{% set version = "0.31.2" %}
{% set sha256 = "bdb9b619f80962dd00c0bffb65e59c53f565c2b550f189a1467f8bc6089401ab" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  # There are no sources on PyPI
  url: https://github.com/ml-explore/mlx/archive/v{{ version }}.tar.gz
  sha256: {{ sha256 }}
  patches:
    - 0001-Omit-visionOS-from-sources.patch
    - 0002-use-conda-CMAKE_OSX_SYSROOT.patch

build:
  number: 0
  skip: true  # [win or py<310 or (osx and x86_64)]

requirements:
  build:
    # need python in the build section to properly build the extensions
    - python
    - {{ compiler('cxx') }}
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - cmake >=3.25
    - ninja
  host:
    - python
    - pip
    - nanobind 2.12.0
    - setuptools >=80
    - typing_extensions
    - libblas        # [not (osx and arm64)]
    - libcblas       # [not (osx and arm64)]
    - liblapack      # [not (osx and arm64)]
    - liblapacke     # [not (osx and arm64)]
  run:
    - python

test:
  imports:
    - mlx
    - mlx.core
  source_files:
    - python/
  requires:
    - pip
    - numpy
  commands:
    - pip check
    - python -m unittest discover python/tests  # [osx and arm64]

about:
  home: https://github.com/ml-explore/mlx
  summary: An array framework for Apple silicon
  description: |
    MLX is an array framework for machine learning on Apple silicon, brought to
    you by Apple machine learning research.
  license: MIT
  license_family: MIT
  license_file: LICENSE
  doc_url: https://ml-explore.github.io/mlx/build/html/index.html
  dev_url: https://github.com/ml-explore/mlx

extra:
  recipe-maintainers:
    - xhochy
    - ngam
