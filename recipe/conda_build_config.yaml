# CANARY — DO NOT MERGE. Mirrors the osx-arm64 values proposed for the aggregate CBC
# (deployment target 13.3, build SDK 14.5 selected through OSX_SDK_VER) so the
# stdlib('c') activation can be observed on a real worker.
c_stdlib_version:            # [osx and arm64]
  - "13.3"                   # [osx and arm64]
MACOSX_DEPLOYMENT_TARGET:    # [osx and arm64]
  - "13.3"                   # [osx and arm64]
macos_min_version:           # [osx and arm64]
  - "13.3"                   # [osx and arm64]
OSX_SDK_VER:                 # [osx and arm64]
  - "14.5"                   # [osx and arm64]
CONDA_BUILD_SYSROOT:         # [osx and arm64]
  - /Library/Developer/CommandLineTools/SDKs/MacOSX14.5.sdk  # [osx and arm64]
