# Build against the macOS 14.5 SDK (present on the PBP workers, confirmed by CI).
# Do NOT raise the runtime macOS floor (c_stdlib_version / MACOSX_DEPLOYMENT_TARGET):
# this is a CPU-only build, so the AR default deployment target is sufficient and
# keeps the package installable on the (older) PBP test workers and end users.
CONDA_BUILD_SYSROOT:
  - /Library/Developer/CommandLineTools/SDKs/MacOSX14.5.sdk  # [osx and arm64]
MACOSX_SDK_VERSION:        # [osx and arm64]
  - "14.5"                 # [osx and arm64]
